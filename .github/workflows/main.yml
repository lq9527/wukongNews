name: 每日热点新闻
run-name: ${{ github.actor }} 正在生成 helloworld 🚀

on:
  schedule:
    - cron: '0 0 * * *'        # 每天 UTC 00:00 = 北京时间 08:00 自动运行
  workflow_dispatch: {}        # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Write helloworld to markdown
        run: |
          mkdir -p news
          cat > news/$(date +'%Y-%m-%d').md <<EOF
          # 📰 Hello World

          *生成时间：$(date +'%Y-%m-%d %H:%M:%S')*

          这是 GitHub Actions 自动生成的文件。
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "📰 helloworld $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
