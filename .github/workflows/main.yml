name: 每日热点新闻
run-name: ${{ github.actor }} 正在生成每日热点新闻 🚀

on:
  schedule:
    - cron: '0 0 * * *'        # 每天 UTC 00:00 = 北京时间 08:00 自动运行
  workflow_dispatch: {}        # 允许在 Actions 页面手动触发

permissions:
  contents: write             # 允许 GITHUB_TOKEN 提交文件

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch news and generate markdown
        run: python scripts/fetch_news.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "📰 每日热点 $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
