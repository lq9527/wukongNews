name: 每日国际要闻

on:
  schedule:
    # 北京时间 08:00（GitHub Actions 使用 UTC，0 0 = 00:00 UTC = 08:00 CST）
    - cron: '0 0 * * *'
  # 允许手动触发，方便先测一次
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install feedparser

      - name: 抓取并发送要闻
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python scripts/fetch_news.py
